#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Người điền: Thành · 28/11/2026. Số lấy từ spec.md §2 (bảng kiểu người dùng, M1, M4, M8) và evidence/summary.md.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người sẽ dùng trợ lý / tháng — 3 kịch bản
  low: 118
  base: 236
  high: 864
  source: "Thấp 118 = L3B ≈ 360 (tự ước tính: chia đôi 721 tài khoản L3 trong data pre-class) × 32,8% đã chủ động hỏi trợ giảng AI (M1, evidence/data-mining.md) — trùng số người ở spec.md §2. Cơ sở 236 = 721 tài khoản L3 × 32,8% (M1). Cao 864 = cả khoá ≈ 1.000 học viên (README hackathon, 'cả khoá hơn 1.000') × 86,4% gặp chỗ không hiểu (khảo sát câu 4, 19/22 — n nhỏ, mẫu tự chọn)."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
