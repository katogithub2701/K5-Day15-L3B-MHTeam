    share: 0.594            # 85/143 người đã hỏi
    uses_per_month: 1.4     # 1 ngày có hỏi / 21 ngày → × 30/21
    turns_per_session: 4
    source: "Tỉ lệ + lần / tháng: phân bố M8 trên 143 người đã hỏi (spec.md §2, evidence/data-mining.md). Lượt hỏi / phiên: 1.091 câu / 256 ngày-người có hỏi ≈ 4,3 → làm tròn 4 (spec.md §2, M4); chia đều cho cả 3 kiểu vì data chưa tách theo kiểu (tự ước tính)."
  - name: hoi_deu
    share: 0.329            # 47/143
    uses_per_month: 3.3     # tb 2,32 ngày có hỏi / 21 ngày → × 30/21
    turns_per_session: 4
    source: "Tỉ lệ + lần / tháng: phân bố M8 (spec.md §2). Lượt hỏi / phiên: ≈ 4,3 câu / ngày-người (M4), làm tròn 4, chưa tách theo kiểu (tự ước tính)."
  - name: hoi_don
    share: 0.077            # 11/143
    uses_per_month: 8.1     # tb 5,64 ngày có hỏi / 21 ngày → × 30/21
    turns_per_session: 4
    source: "Tỉ lệ + lần / tháng: phân bố M8 (spec.md §2). Lượt hỏi / phiên: ≈ 4,3 câu / ngày-người (M4), làm tròn 4, chưa tách theo kiểu (tự ước tính). Kiểm chéo: khảo sát câu 3 cho ≈ 6,4 lần xem trước slide / người / tháng — trên mức hỏi của data, nên số lần dùng ở đây thiên về thấp."
