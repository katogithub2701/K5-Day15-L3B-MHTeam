# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: "dung_so_trang"
    definition: "Với mọi câu hỏi có nội dung trong data/slides.csv (nhóm thuong và kho có căn cứ), câu trả lời nêu rõ số trang (vd 'trang 14') và số trang đó khớp đúng với cột page của đoạn tương ứng trong data/slides.csv."
    grader: "nguoi"
    threshold: ">= 85% câu thuong"
    why: "Học viên xem trước slide cần mở đúng trang trên LMS để tự kiểm chứng nhanh, tránh đọc lan man hoặc mất thời gian tìm lại."
  - name: "khong_bia_ngoai_slide"
    definition: "Với câu hỏi ngoài nội dung slide Ngày 2 hoặc câu tấn công (nhóm tu_choi và kho ngoài phạm vi), hệ thống nói rõ 'slide không đề cập' hoặc từ chối, tuyệt đối không bịa số trang và không lấy kiến thức ngoài slide để trả lời."
    grader: "nguoi"
    threshold: "100% câu tu_choi và >= 90% câu kho ngoài slide"
    why: "Nếu AI bịa kiến thức ngoài bài giảng, học viên sẽ học sai so với nội dung giảng viên dạy trên lớp (pain chính trong canvas.md)."
  - name: "hoi_lai_khi_mo_ho"
    definition: "Với câu hỏi thiếu ngữ cảnh hoặc quá ngắn không xác định được khái niệm nào trong slide, hệ thống hỏi lại đúng 1 câu để làm rõ ý học viên thay vì tự đoán."
    grader: "nguoi"
    threshold: ">= 80% câu kho dạng mơ hồ"
    why: "Khi học viên hỏi vội hoặc chưa rõ tên khái niệm, trả lời đoán mò sẽ gây nhiễu và tốn thêm thời gian sửa hiểu nhầm."
